function renderVals(vals) {
  const counts = {};
  vals.forEach(v => counts[v] = (counts[v]||0)+1);
  return vals.map(v => counts[v] > 1 ? `<span class="rep">${v}</span>` : `${v}`).join(' ');
}

      `<span class="pos">@${pos}</span>[${renderVals(vals)}]`
    ).join(' ');
    return `<span class="occ"><span class="mn">${msg}</span>: ${occStr}</span>`;
  }).join('');
  html += `<tr>
    <td class="pat">${pat}</td>
    <td class="len">${len}</td>
